<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow 2050 // Matriz de Aprendizado Neural</title>
    <!-- Fontes Futuristas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- Icones Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-deep: #05070f;
            --panel-bg: rgba(12, 18, 34, 0.75);
            --panel-border: rgba(0, 243, 255, 0.25);
            --neon-cyan: #00f3ff;
            --neon-pink: #ff007f;
            --neon-purple: #b026ff;
            --text-main: #e0f7fc;
            --text-dim: #70889b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(176, 38, 255, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(0, 243, 255, 0.12) 0%, transparent 40%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        /* Container Principal */
        .app-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* Sidebar Futurista */
        aside {
            width: 260px;
            background: rgba(8, 11, 22, 0.85);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 1.5rem;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 2px;
        }

        .brand i {
            color: var(--neon-cyan);
            filter: drop-shadow(0 0 8px var(--neon-cyan));
        }

        .brand span {
            color: var(--neon-cyan);
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 2rem;
        }

        nav a {
            color: var(--text-dim);
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 1px;
            padding: 12px 16px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
        }

        nav a:hover, nav a.active {
            color: #fff;
            background: rgba(0, 243, 255, 0.1);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .system-status {
            padding: 1rem;
            background: rgba(0, 243, 255, 0.05);
            border: 1px dashed var(--panel-border);
            border-radius: 8px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem;
            color: var(--neon-cyan);
        }

        .system-status div {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        /* Conteúdo Principal */
        main {
            flex: 1;
            padding: 2.5rem;
            overflow-y: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(0, 243, 255, 0.15);
        }

        .header-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #fff, var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }

        .header-title p {
            color: var(--text-dim);
            font-size: 1.1rem;
            margin-top: 4px;
        }

        .hud-badge {
            background: rgba(176, 38, 255, 0.1);
            border: 1px solid var(--neon-purple);
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85rem;
            color: #fff;
            box-shadow: 0 0 10px rgba(176, 38, 255, 0.3);
        }

        /* Grid do Dashboard */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 992px) {
            .app-container { flex-direction: column; }
            aside { width: 100%; }
            .dashboard-grid { grid-template-columns: 1fr; }
        }

        /* Estilo dos Cards HUD */
        .hud-card {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 1.8rem;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .hud-card:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
        }

        .hud-card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 20px;
            width: 40px;
            height: 2px;
            background: var(--neon-cyan);
            box-shadow: 0 0 8px var(--neon-cyan);
        }

        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--neon-cyan);
        }

        /* Módulo de Tarefas Cyberpunk */
        .task-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .task-input-group input {
            flex: 1;
            background: rgba(5, 7, 15, 0.8);
            border: 1px solid var(--panel-border);
            padding: 12px 16px;
            border-radius: 6px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        .task-input-group input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        .btn-cyber {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
        }

        .btn-cyber:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
        }

        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 320px;
            overflow-y: auto;
        }

        .task-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 16px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .task-item:hover {
            background: rgba(0, 243, 255, 0.05);
            border-color: rgba(0, 243, 255, 0.3);
        }

        .task-item.completed span {
            text-decoration: line-through;
            color: var(--text-dim);
            opacity: 0.6;
        }

        .task-actions {
            display: flex;
            gap: 10px;
        }

        .task-actions button {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            transition: color 0.2s;
        }

        .task-actions button:hover {
            color: var(--neon-cyan);
        }

        .task-actions button.delete:hover {
            color: var(--neon-pink);
        }

        /* Módulo Pomodoro Holográfico */
        .pomodoro-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .timer-circle {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 1rem 0;
        }

        .timer-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .timer-bg-circle {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 8;
        }

        .timer-progress-circle {
            fill: none;
            stroke: var(--neon-cyan);
            stroke-width: 8;
            stroke-dasharray: 565;
            stroke-dashoffset: 0;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s linear;
            filter: drop-shadow(0 0 8px var(--neon-cyan));
        }

        .timer-display {
            position: absolute;
            font-family: 'Share Tech Mono', monospace;
            font-size: 3rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 15px var(--neon-cyan);
        }

        .pomodoro-controls {
            display: flex;
            gap: 12px;
            margin-top: 1rem;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-outline:hover {
            background: rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside>
            <div>
                <div class="brand">
                    <i class="fas fa-atom"></i>
                    STUDY<span>FLOW</span>
                </div>
                <nav>
                    <a href="#" class="active"><i class="fas fa-chart-pie"></i> PAINEL 2050</a>
                    <a href="#tarefas"><i class="fas fa-tasks"></i> MATRIZ DE TAREFAS</a>
                    <a href="#pomodoro"><i class="fas fa-stopwatch"></i> POMODORO HUD</a>
                </nav>
            </div>

            <div class="system-status">
                <div><span>SISTEMA:</span> <span style="color: #00ff66;">ONLINE</span></div>
                <div><span>LINK NEURAL:</span> <span>98.4%</span></div>
                <div><span>ANO:</span> <span>2050</span></div>
            </div>
        </aside>

        <!-- Área Principal -->
        <main>
            <header>
                <div class="header-title">
                    <h1>Olá, Operador(a) 🚀</h1>
                    <p>Sincronizando módulo de foco e otimização cognitiva...</p>
                </div>
                <div class="hud-badge">
                    <i class="fas fa-wifi"></i> CONEXÃO NEURAL ATIVA
                </div>
            </header>

            <div class="dashboard-grid">
                <!-- Seção de Tarefas -->
                <section class="hud-card" id="tarefas">
                    <div class="card-title">
                        <i class="fas fa-microchip"></i>
                        <span>O QUE ESTUDAR HOJE? // MATRIZ</span>
                    </div>

                    <div class="task-input-group">
                        <input type="text" id="task-input" placeholder="Nova diretriz de estudo...">
                        <button class="btn-cyber" onclick="addTask()">+ ADICIONAR</button>
                    </div>

                    <ul class="task-list" id="task-list">
                        <!-- Tarefas inseridas dinamicamente -->
                    </ul>
                </section>

                <!-- Seção Pomodoro -->
                <section class="hud-card pomodoro-container" id="pomodoro">
                    <div class="card-title" style="width: 100%;">
                        <i class="fas fa-bolt"></i>
                        <span>POMODORO CIBERNÉTICO</span>
                    </div>

                    <div class="timer-circle">
                        <svg class="timer-svg" viewBox="0 0 200 200">
                            <circle class="timer-bg-circle" cx="100" cy="100" r="90"></circle>
                            <circle class="timer-progress-circle" id="progress-circle" cx="100" cy="100" r="90"></circle>
                        </svg>
                        <div class="timer-display" id="timer-display">25:00</div>
                    </div>

                    <div class="pomodoro-controls">
                        <button class="btn-cyber" id="start-btn" onclick="toggleTimer()">INICIAR</button>
                        <button class="btn-outline" onclick="resetTimer()">RESETAR</button>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Lógica JavaScript -->
    <script>
        /* === LÓGICA DO POMODORO === */
        let timeLeft = 25 * 60;
        let totalTime = 25 * 60;
        let timerInterval = null;
        let isRunning = false;

        const timerDisplay = document.getElementById('timer-display');
        const startBtn = document.getElementById('start-btn');
        const progressCircle = document.getElementById('progress-circle');
        const maxOffset = 565; // Comprimento da circunferência do SVG (2 * PI * 90)

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            // Atualizar barra circular de progresso
            const offset = maxOffset - (timeLeft / totalTime) * maxOffset;
            progressCircle.style.strokeDashoffset = offset;
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerInterval);
                startBtn.textContent = 'CONTINUAR';
                startBtn.style.background = 'linear-gradient(135deg, var(--neon-purple), var(--neon-cyan))';
                isRunning = false;
            } else {
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerInterval);
                        alert(' SESSÃO DE FOCO CONCLUÍDA! Descanse seus circuitos.');
                        resetTimer();
                    }
                }, 1000);
                startBtn.textContent = 'PAUSAR';
                startBtn.style.background = 'var(--neon-pink)';
                isRunning = true;
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            timeLeft = 25 * 60;
            startBtn.textContent = 'INICIAR';
            startBtn.style.background = 'linear-gradient(135deg, var(--neon-purple), var(--neon-cyan))';
            updateDisplay();
        }

        /* === LÓGICA DA MATRIZ DE TAREFAS (LOCALSTORAGE) === */
        let tasks = JSON.parse(localStorage.getItem('studyflow_2050_tasks')) || [
            { text: "Estudar Redes Neurais e IA", completed: false },
            { text: "Revisar Mecânica Quântica", completed: true }
        ];

        function saveTasks() {
            localStorage.setItem('studyflow_2050_tasks', JSON.stringify(tasks));
        }

        function renderTasks() {
            const list = document.getElementById('task-list');
            list.innerHTML = '';

            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = `task-item ${task.completed ? 'completed' : ''}`;
                li.innerHTML = `
                    <span>${task.text}</span>
                    <div class="task-actions">
                        <button onclick="toggleTask(${index})"><i class="fas ${task.completed ? 'fa-undo' : 'fa-check'}"></i></button>
                        <button class="delete" onclick="deleteTask(${index})"><i class="fas fa-trash"></i></button>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function addTask() {
            const input = document.getElementById('task-input');
            const text = input.value.trim();
            if (text !== '') {
                tasks.push({ text, completed: false });
                input.value = '';
                saveTasks();
                renderTasks();
            }
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            saveTasks();
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            saveTasks();
            renderTasks();
        }

        // Permite adicionar tarefas teclando Enter
        document.getElementById('task-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') addTask();
        });

        // Inicializar aplicação
        updateDisplay();
        renderTasks();
    </script>
</body>
</html>
